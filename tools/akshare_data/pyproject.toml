[project]
name = "kline-akshare-data"
version = "0.1.0"
description = "Fetch Sina futures minute bars through AKShare for kline.luajit tests"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "akshare==1.18.87",
    "pandas>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
